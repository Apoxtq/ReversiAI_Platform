name: Coverage

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake lcov

      - name: Configure (with coverage)
        run: |
          cmake -S . -B build_cov -DBUILD_TESTS=ON -DCOVERAGE=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: |
          cmake --build build_cov --config Debug -- -j2

      - name: Run tests
        run: |
          ctest --test-dir build_cov -C Debug --output-on-failure

      - name: Capture coverage
        run: |
          lcov --capture --directory build_cov --output-file coverage.info || true
          lcov --remove coverage.info '/usr/*' --output-file coverage.info || true
          genhtml coverage.info --output-directory coverage_report || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_report

      - name: Upload coverage info
        uses: actions/upload-artifact@v4
        with:
          name: coverage-info
          path: coverage.info


