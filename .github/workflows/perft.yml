name: Network Module Tests

on:
  schedule:
    - cron: '0 2 * * *'  # daily at 02:00 UTC
  workflow_dispatch:

jobs:
  network-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake qt6-base-dev qt6-base-dev-tools

      - name: Configure
        run: |
          cmake -S . -B build_network -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build network module
        run: |
          cmake --build build_network --config Release --target network_lib -- -j2

      - name: Run message tests
        run: |
          echo "=== Running Message Tests ==="
          ./build_network/bin/network_test_message

      - name: Run discovery & sync tests
        run: |
          echo "=== Running Discovery & Sync Tests ==="
          ./build_network/bin/network_test_discovery_sync

      - name: Run room & reconnect tests
        run: |
          echo "=== Running Room & Reconnect Tests ==="
          ./build_network/bin/network_test_room_reconnect

      - name: Run integration tests
        run: |
          echo "=== Running Integration Tests ==="
          ./build_network/bin/network_test_integration
          echo ""
          echo "=== All Network Tests PASSED ==="
