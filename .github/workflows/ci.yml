name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: |
            build
          key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt') }}

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake lcov

      - name: Configure
        run: |
          cmake -S . -B build -DBUILD_TESTS=ON ${CM_FLAGS}

      - name: Build
        run: |
          cmake --build build --config Debug -- -j2

      - name: Run tests
        run: |
          ctest --test-dir build -C Debug --output-on-failure || true

      - name: Upload ctest log
        uses: actions/upload-artifact@v4
        with:
          name: ctest-output-${{ matrix.os }}
          path: build/Testing/Temporary/LastTest.log

      - name: Upload build directory (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: build


